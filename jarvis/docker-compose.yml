# JARVIS v5.6 — auto-hébergement Docker
#   cp .env.example .env   (remplis JARVIS_PASSWORD, etc.)
#   docker compose up -d --build
#   → http://localhost:8004/app   ·   /os (HUD)   ·   /gardien
services:
  jarvis:
    build: .
    image: jarvis-guardian:5.6
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      # Le Gardien reste 100% local par défaut ; l'audio est désactivé.
      GUARDIAN_CLOUD_VISION: "0"
      GUARDIAN_AUDIO_ENABLED: "0"
    volumes:
      # Persistance hors image (aucune donnée personnelle dans l'image/Git).
      - jarvis_memory:/app/memory
      - jarvis_security:/app/security
      - jarvis_logs:/app/logs
      - jarvis_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Vision locale optionnelle (aucune image ne quitte le réseau).
  #   décommente puis: GUARDIAN_VISION_PROVIDER=ollama, JARVIS_VISION_MODEL=llava
  # Ollama peut être lancé séparément avec une version explicitement épinglée.
  # Ne déploie pas une image flottante « latest » en production.

volumes:
  jarvis_memory:
  jarvis_security:
  jarvis_logs:
  jarvis_data:
  # ollama:
