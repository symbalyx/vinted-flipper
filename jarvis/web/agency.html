<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Agency</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111722;--line:#293445;--txt:#eef5ff;--muted:#93a4ba;--cyan:#67e8f9;--green:#86efac;--amber:#fcd34d;--red:#fca5a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 25% 0,#132133,var(--bg) 42%);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}header{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#080b10e8;backdrop-filter:blur(14px);z-index:2}header a{color:var(--cyan);text-decoration:none}h1{font-size:18px;margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px}.card{background:#111722e8;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 18px 50px #0006}textarea,input{width:100%;background:#080d14;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px}textarea{min-height:145px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--cyan);color:#061019}button.secondary{background:#273244;color:var(--txt)}button.danger{background:#5b2028;color:#ffd9dc}button:disabled{opacity:.5;cursor:not-allowed}.mission{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;cursor:pointer}.mission:hover{border-color:#4f6683}.top{display:flex;justify-content:space-between;gap:12px}.goal{font-weight:700}.status{font:11px ui-monospace,monospace;text-transform:uppercase;color:var(--amber)}.status.completed{color:var(--green)}.status.failed,.status.cancelled,.status.blocked{color:var(--red)}.status.retry_wait,.status.paused,.status.verifying{color:var(--amber)}.meta,.empty{color:var(--muted);font-size:12px}.step{border-left:3px solid #3b4b61;padding:9px 12px;margin:9px 0;background:#0c1119;border-radius:0 9px 9px 0}.step.completed{border-color:var(--green)}.step.running{border-color:var(--cyan)}.step.waiting_approval,.step.retry_wait{border-color:var(--amber)}.step.failed,.step.blocked{border-color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;background:#070b11;border:1px solid var(--line);padding:12px;border-radius:10px;max-height:330px;overflow:auto}.event{font-size:12px;color:var(--muted);border-bottom:1px solid #202a38;padding:6px 0}.actions{display:flex;gap:8px;margin:12px 0}.pill{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:14px}header{padding:14px}}
</style></head><body><header><a href="/app">← JARVIS</a><h1>Agency · missions multi‑agents</h1><span class="pill" id="summary">connexion…</span></header><main class="wrap"><div class="grid"><section class="card"><h2>Nouvelle mission</h2><p class="meta">JARVIS planifie, travaille en parallèle, écrit des checkpoints, reprend après redémarrage et ne marque la mission terminée qu'après validation de la définition de fini.</p><label>Objectif</label><textarea id="goal" placeholder="Ex. Trouve 20 prospects publics qualifiés, prépare 5 brouillons vérifiables, crée un workflow n8n inactif et fournis un rapport avec preuves."></textarea><label>Définition de fini</label><textarea id="criteria" placeholder="Ex. 20 prospects dédupliqués avec source URL, score et motif ; 5 brouillons ; aucun envoi sans approbation ; tests verts."></textarea><div class="row"><div><label>Tranche max (min)</label><input id="minutes" type="number" min="1" max="10080" value="180"></div><div><label>Sous‑agents</label><input id="agents" type="number" min="1" max="8" value="4"></div><div><label>Étapes max</label><input id="steps" type="number" min="2" max="40" value="16"></div></div><div class="row"><label style="display:flex;align-items:center;gap:8px"><input id="continue" type="checkbox" checked style="width:auto"> Continuer jusqu'à validation</label><div><label>Cycles de réparation</label><input id="repairs" type="number" min="0" max="12" value="3"></div></div><button id="launch" style="margin-top:14px">Lancer la mission durable</button><h2 style="margin-top:25px">Missions</h2><div id="missions" class="empty">Chargement…</div></section><section class="card"><div id="detail" class="empty">Sélectionne une mission.</div></section></div></main>
<script>
const $=id=>document.getElementById(id), text=(tag,v,c)=>{const e=document.createElement(tag);if(c)e.className=c;e.textContent=String(v??"");return e};let current="";async function api(path,opt={}){const r=await fetch(path,{credentials:"include",headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}function fmt(ts){return ts?new Date(ts*1000).toLocaleString():"—"}async function load(){try{const d=await api('/api/agency/missions');const list=d.missions||[];$('summary').textContent=`${list.length} mission(s)`;const box=$('missions');box.replaceChildren();if(!list.length){box.append(text('div','Aucune mission.','empty'));return}for(const m of list){const card=text('div','',`mission ${m.status}`);const top=text('div','', 'top');top.append(text('div',m.goal,'goal'),text('div',m.status,`status ${m.status}`));card.append(top,text('div',`${fmt(m.created_at)} · ${m.max_agents} agent(s) · tranche ${m.max_minutes} min · réparation ${m.repair_cycle||0}/${m.max_repair_cycles||0}`,'meta'));card.onclick=()=>show(m.id);box.append(card)}if(current)show(current,false)}catch(e){$('missions').textContent=e.message}}async function show(id,scroll=true){current=id;const d=await api(`/api/agency/missions/${id}`),m=d.mission,box=$('detail');box.replaceChildren();const h=text('h2',m.goal);const st=text('span',m.status,`status ${m.status}`);box.append(h,st,text('p',m.summary||'Planification en cours…','meta'));const actions=text('div','', 'actions');if(!['completed','failed','cancelled'].includes(m.status)){const cancel=text('button','Annuler','danger');cancel.onclick=async()=>{await api(`/api/agency/missions/${id}/cancel`,{method:'POST'});load()};actions.append(cancel)}if(['waiting_approval','interrupted','paused','retry_wait','blocked','failed'].includes(m.status)){const resume=text('button','Reprendre','secondary');resume.onclick=async()=>{await api(`/api/agency/missions/${id}/resume`,{method:'POST'});load()};actions.append(resume)}box.append(actions);for(const s of m.steps||[]){const card=text('div','',`step ${s.status}`);card.append(text('div',`${s.seq}. ${s.title} — ${s.role}`),text('div',`${s.status} · essai ${s.attempt||0}/${s.max_attempts||0} · cycle erreur ${s.failure_cycle||0}`,'meta'));if(s.result)card.append(text('pre',s.result));if(s.error)card.append(text('pre',s.error));box.append(card)}if(m.result){box.append(text('h3','Résultat final'),text('pre',m.result))}if(m.error){box.append(text('h3','Erreur'),text('pre',m.error))}box.append(text('h3','Journal'));for(const e of m.events||[])box.append(text('div',`${new Date(e.created_at*1000).toLocaleTimeString()} · ${e.kind} · ${e.message}`,'event'));if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
$('launch').onclick=async()=>{const goal=$('goal').value.trim();if(!goal)return;const b=$('launch');b.disabled=true;try{const d=await api('/api/agency/missions',{method:'POST',body:JSON.stringify({goal,completion_criteria:$('criteria').value.trim(),continue_until_done:$('continue').checked,max_repair_cycles:+$('repairs').value,max_minutes:+$('minutes').value,max_agents:+$('agents').value,max_steps:+$('steps').value})});$('goal').value='';$('criteria').value='';current=d.mission.id;await load();await show(current)}catch(e){alert(e.message)}finally{b.disabled=false}};load();setInterval(load,2500);
</script></body></html>
