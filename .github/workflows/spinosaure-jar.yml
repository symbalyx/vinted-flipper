name: Spinosaure - construire le jar

on:
  push:
    branches: [claude/spinosaure-animations-aquatiques-vqg4qt]
    paths: ['spinosaure-mod/**', '.github/workflows/spinosaure-jar.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spinosaure-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Compiler, tester et empaqueter
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: spinosaure-jar
          path: spinosaure-mod/build/libs/*.jar
      - name: Deposer le jar sur la branche (dist/)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          mkdir -p dist
          cp spinosaure-mod/build/libs/spinosaure-*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "Jar du spinosaure construit par GitHub Actions [skip ci]"
          git push
      - name: Essais en jeu (serveur Minecraft sans ecran, GameTest)
        id: essais
        continue-on-error: true
        run: |
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee essais.log
          exit ${PIPESTATUS[0]}
      - name: Bilan des essais en jeu
        if: always()
        run: |
          grep -E "\[ESSAI\] RESUME|passed|failed|GameTest|Exception|ERROR" essais.log | grep -v DEBUG | tail -120 || true
          echo "----- journal detaille -----"
          grep "\[ESSAI\]" essais.log | tail -700 || true
          echo "----- resumes -----"
          grep -o "\[ESSAI\] RESUME.*" essais.log || true
      - name: Rapports en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: spinosaure-mod/build/reports/
